name: Owner video order and migration inventory (once)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-video-order.yml']
permissions:
  contents: write
concurrency:
  group: owner-video-order
  cancel-in-progress: false
jobs:
  apply:
    if: github.actor == 'virudik'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOLDER: chatgpt:ordinary:79dd16b2-9780-466c-a616-33cb3eb1387d
      ACQUIRED: '2026-11-08T07:23:48Z'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare exact guarded changes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/owner-order.py <<'PY'
          import os,re,json,base64,urllib.request,subprocess,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          def lease():
              u='https://api.github.com/repos/virudik/ai-film-prompts/contents/ops/canon-lock.json?ref=main'
              req=urllib.request.Request(u,headers={'Accept':'application/vnd.github+json','User-Agent':'owner-video-order'})
              j=json.load(urllib.request.urlopen(req,timeout=25)); l=json.loads(base64.b64decode(j['content']))
              assert l['state']=='held' and l['holder']==os.environ['HOLDER'] and l['acquired_at']==os.environ['ACQUIRED']
              assert datetime.fromisoformat(l['expires_at'].replace('Z','+00:00'))>datetime.now(timezone.utc)
          lease()
          if os.environ.get('CHECK_ONLY')=='1': raise SystemExit(0)
          rp=Path('reports/owner-video-order-2026-11-08.json')
          if rp.exists():
              j=json.loads(rp.read_text())
              if j.get('request_id')=='owner-order-20261108': raise SystemExit('Already applied; do not repeat')
          ids=['81a1e6150e98400ce7732b6da6bbc3e6','a260d16ec1ec08900d878aec655b62b0','bded60522d4d787ae2df31e8ebe5ad23','71a96d88e127f61acd8e49c3831b50d7','f28cf60c314b00eadc77d88f582e1be0','5c9529ad09a354eb24e7fec0030f8108']
          dp=Path('js/videos-data.js'); data=dp.read_text()
          before_data=hashlib.sha256(dp.read_bytes()).hexdigest()
          for i,vid in enumerate(ids,1):
              old="rutube: '"+vid+"'"
              assert data.count(old)==1
              data=data.replace(old,'order: '+str(i)+', '+old)
          data=data.replace('Порядок карточек определяется в rudik.js: готовые → проверяемые → «скоро».','Первые шесть карточек — точный порядок владельца 08.11 (поле order); остальные: готовые → проверяемые → «скоро».')
          data=data.replace('Версии локальных MP4 в GitHub не удалять.','Локальные MP4 не удалять до проверенного воспроизведения Rutube и сохранения исходников (условие владельца 08.11).')
          dp.write_text(data)
          jp=Path('js/rudik.js'); js=jp.read_text(); old='items.sort(function (a, b) { return group(a) - group(b); });'
          assert js.count(old)==1
          js=js.replace('// Стабильная группировка: доступные → ожидающие проверки → «скоро».','// Явный порядок шести роликов владельца; остальные группируются по доступности.')
          js=js.replace(old,"items.sort(function (a, b) {\n      var ar = typeof a.order === 'number' ? a.order : 1000;\n      var br = typeof b.order === 'number' ? b.order : 1000;\n      return ar - br || group(a) - group(b);\n    });")
          jp.write_text(js)
          tp=Path('test/check-sync.js'); tests=tp.read_text()
          for stem in ['videos-data','rudik']:
              tests=tests.replace(stem+'.js?v=4',stem+'.js?v=5').replace(stem+r'\.js\?v=4',stem+r'\.js\?v=5')
          oldtest="ok('Loaded videos, then pending Rutube review, then скоро',\n  ranks.every(function (v, i) { return i === 0 || v >= ranks[i - 1]; }) &&\n  ranks.filter(function (v) { return v === 0; }).length === 6 &&\n  ranks.filter(function (v) { return v === 1; }).length === 1 &&\n  ranks.filter(function (v) { return v === 2; }).length === 7);"
          assert tests.count(oldtest)==1
          newtest="var ownerIds = "+json.dumps(ids)+";\nvar renderedIds = names.map(function (name) { return renderWindow.RUDIK_VIDEOS.find(function (x) { return x.title === name; }).rutube; });\nok('Exact owner order: Открытка ОСД Котмонавты ЗВ Финансовые Алексей', JSON.stringify(renderedIds.slice(0, 6)) === JSON.stringify(ownerIds));\nok('Remaining videos before remaining soon cards', ranks.slice(6).every(function (v, i, a) { return i === 0 || v >= a[i - 1]; }));\nok('Explicit order preserves pending flags and all fourteen cards', names.length === 14 && renderWindow.RUDIK_VIDEOS.filter(function (v) { return v.review === 'pending'; }).length === 3);"
          tp.write_text(tests.replace(oldtest,newtest))
          changed=[]
          tracked=subprocess.check_output(['git','ls-files','-z'],text=True).split('\0')
          for name in tracked:
              if not name.endswith('.html'): continue
              p=Path(name); text=p.read_text(); new=text
              for stem in ['videos-data','rudik']:
                  new=re.sub(r'/js/'+stem+r'\.js\?v=4\b','/js/'+stem+'.js?v=5',new)
              if new!=text: p.write_text(new); changed.append(name)
          assert 'index.html' in changed and 'test/index.html' in changed and len(changed)>=13
          yt={}
          for name in tracked:
              if not name.endswith(('.html','.js')) or name.startswith(('.github/','reports/')):continue
              p=Path(name)
              if not p.is_file():continue
              text=p.read_text(errors='replace').replace('\\/','/')
              patterns=[r'(?:youtube(?:-nocookie)?\.com/(?:embed/|watch\?v=)|youtu\.be/)([A-Za-z0-9_-]{11})([^\s\"\'<>]*)',r"youtube\s*:\s*['\"]([A-Za-z0-9_-]{11})['\"]"]
              for pattern in patterns:
                  for m in re.finditer(pattern,text):
                      item=yt.setdefault(m[1],{'video_id':m[1],'youtube_url':'https://www.youtube.com/watch?v='+m[1],'occurrences':[],'migration_status':'not_imported','rights':'not_verified_by_inventory'})
                      occurrence={'file':name,'source_excerpt':text[max(0,m.start()-50):m.end()+60]}
                      if occurrence not in item['occurrences']: item['occurrences'].append(occurrence)
          inv={'schema_version':1,'checked_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),'unique_video_count':len(yt),'videos':list(yt.values()),'upload_performed':False,'next_action':'Use authorized Rutube Studio owner-channel import or original files with rights; verify individual target ID and playback before replacing each embed. No bulk import of foreign TV channels.','official_instructions':'https://rutube.ru/info/youtube/'}
          Path('reports').mkdir(exist_ok=True)
          Path('reports/youtube-migration-inventory.json').write_text(json.dumps(inv,ensure_ascii=False,indent=2)+'\n')
          checks=[]
          for cmd in [['node','--check','js/rudik.js'],['node','--check','js/videos-data.js'],['node','test/check-sync.js']]:
              run=subprocess.run(cmd,text=True,capture_output=True); checks.append({'command':cmd,'exit_code':run.returncode,'output_tail':(run.stdout+run.stderr)[-3000:]})
              if run.returncode: print(run.stdout+run.stderr); raise SystemExit(run.returncode)
          proof={'schema_version':1,'request_id':'owner-order-20261108','checked_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),'source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'holder':os.environ['HOLDER'],'exact_first_six_rutube_ids':ids,'order_status':'code_and_render_regression_verified','publication_status':'requires_commit_and_Pages_readback','original_videos_data_sha256':before_data,'html_cache_versions_updated':changed,'youtube_inventory_count':len(yt),'tests':checks,'video_files_deleted':[],'rutube_pending_changed':False,'no_video_upload_or_generation':True}
          rp.write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          hp=Path('HANDOFF.md'); h=hp.read_text()
          note='\n## Новое решение 08.11.2026 — порядок и перенос видео\n\nПервые карточки: Открытка → ОСД → Котмонавты → ЗВ → Финансовые → Алексей, затем остальные. `order` в `js/videos-data.js` выше прежней группировки этих шести. Cache: videos-data/rudik v5 во всех страницах. Код и фактический DOM-порядок проверены `node test/check-sync.js`; свидетельство `reports/owner-video-order-2026-11-08.json`. YouTube-инвентарь — `reports/youtube-migration-inventory.json`, перенос ещё не выполнен. Новое разрешение владельца: заменить готовым Rutube-плеером и убрать заменённый MP4 только после проверки воспроизведения и сохранения исходника; не удалять рабочий fallback из-за одной доступной страницы-заголовка. DNS/сертификаты рассматриваются отдельно, старые формулировки «корневой HTTPS ждёт» исторические.\n'
          assert '## Новое решение 08.11.2026 — порядок и перенос видео' not in h
          h=h.replace('\n', '\n'+note+'\n',1); hp.write_text(h)
          lease()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 /tmp/owner-order.py
            git add js/videos-data.js js/rudik.js test/check-sync.js HANDOFF.md reports/owner-video-order-2026-11-08.json reports/youtube-migration-inventory.json
            git ls-files -z '*.html' | xargs -0 git add --
            git diff --cached --check
            CHECK_ONLY=1 python3 /tmp/owner-order.py
            git commit -m 'Owner order: Открытка ОСД Котмонавты ЗВ Финансовые Алексей; inventory YouTube'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
