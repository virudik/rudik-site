name: Postcard subtitle once
on:
  push:
    branches: [main]
    paths: [.github/workflows/postcard-subtitle-once.yml]
permissions:
  contents: write
concurrency:
  group: rudik-postcard-subtitle
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Apply only the requested subtitle and verify both renderers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > /tmp/postcard-subtitle.py <<'PY'
          from pathlib import Path
          import subprocess
          target = Path('js/videos-data.js')
          old = "{ title: 'Открытка', order: 1, rutube: '81a1e6150e98400ce7732b6da6bbc3e6', shorts: true }"
          new = "{ title: 'Открытка', subtitle: '(Новогоднее поздравление)', order: 1, rutube: '81a1e6150e98400ce7732b6da6bbc3e6', shorts: true }"
          text = target.read_text()
          assert text.count(old) == 1, 'Postcard source changed; inspect before applying'
          target.write_text(text.replace(old, new, 1))
          changed = [str(target)]
          for name in ['js/rudik.js', 'test/test.js']:
              p = Path(name); text = p.read_text()
              anchor = "var t = document.createElement('div'); t.className = 'rv-t'; t.textContent = v.title; c.appendChild(t);"
              assert text.count(anchor) == 1, name
              indent = '      ' if name == 'js/rudik.js' else '    '
              addition = ("\n" + indent + "if (v.subtitle) {\n" + indent + "  var subtitle = document.createElement('div'); subtitle.className = 'rv-subtitle';\n" + indent + "  subtitle.textContent = v.subtitle; t.appendChild(subtitle);\n" + indent + "}")
              p.write_text(text.replace(anchor, anchor + addition, 1)); changed.append(name)
          versions = [('videos-data.js?v=7', 'videos-data.js?v=8'), ('rudik.js?v=5', 'rudik.js?v=6'), ('test.js?v=3', 'test.js?v=4')]
          expected_pages = {'index.html','алина/index.html','маша/index.html','виталик/index.html','иишница/index.html','мои-видео/index.html','обо-мне/index.html','промты/index.html','работа/index.html','фото/index.html','видео/index.html','prompts/index.html','test/index.html'}
          updated_pages = set()
          for p in Path('.').rglob('*.html'):
              text = p.read_text(); edited = text
              for before, after in versions:
                  edited = edited.replace(before, after)
              if edited != text:
                  assert p.as_posix() in expected_pages, str(p)
                  p.write_text(edited); updated_pages.add(p.as_posix()); changed.append(p.as_posix())
          assert updated_pages == expected_pages, sorted(updated_pages)
          tests = Path('test/check-sync.js'); text = tests.read_text()
          for before, after in [(r'videos-data\.js\?v=7', r'videos-data\.js\?v=8'), (r'rudik\.js\?v=5', r'rudik\.js\?v=6'), (r'test\.js\?v=3', r'test\.js\?v=4')]:
              assert before in text, before
              text = text.replace(before, after)
          marker = "console.log(fail ? '\\n' + fail + ' failed' : '\\nall checks passed');"
          assert text.count(marker) == 1
          extra = '''// Подпись Открытки: отдельная строка в том же оформлении заголовка.
          var postcard = renderWindow.RUDIK_VIDEOS.find(function (v) { return v.rutube === '81a1e6150e98400ce7732b6da6bbc3e6'; });
          ok('Postcard keeps its title, first position and exact Rutube ID', postcard.title === 'Открытка' && postcard.order === 1 && postcard.shorts === true);
          ok('Only postcard receives the requested subtitle', postcard.subtitle === '(Новогоднее поздравление)' && renderWindow.RUDIK_VIDEOS.filter(function (v) { return v.subtitle; }).length === 1);
          function hasPostcardSubtitle(grid) {
            var card = grid.children.find(function (c) { return c.children[0].textContent === 'Открытка'; });
            if (!card) return false;
            var title = card.children[0];
            return title.className === 'rv-t' && title.children.length === 1 && title.children[0].type === 'div' && title.children[0].className === 'rv-subtitle' && title.children[0].textContent === '(Новогоднее поздравление)';
          }
          ok('Main renders postcard subtitle as a separate block under its title', hasPostcardSubtitle(renderGrid));
          var testGrid = { children: [], appendChild: function (c) { this.children.push(c); } };
          var testDocument = Object.assign({}, renderDocument, { getElementById: function (id) { return id === 'iiVideoGrid' ? testGrid : null; } });
          var testRenderer = read('test/test.js');
          testRenderer = testRenderer.slice(0, testRenderer.indexOf('})();') + 5);
          vm.runInNewContext(vids + '\\n' + testRenderer, { document: testDocument, window: {} });
          ok('Test page renderer keeps the same separate postcard subtitle', hasPostcardSubtitle(testGrid));
          '''
          tests.write_text(text.replace(marker, extra + '\n' + marker)); changed.append(str(tests))
          handoff = Path('HANDOFF.md'); text = handoff.read_text()
          heading = '# HANDOFF — рудик.рф (репозиторий `virudik/rudik-site`)'
          assert text.startswith(heading)
          note = '\n\n## Подпись Открытки — решение владельца 12.11.2026\n\nВ ИИшнице под «Открытка» добавлена отдельная строка «(Новогоднее поздравление)» с наследованием оформления заголовка. Источник — поле subtitle в js/videos-data.js; основной и тестовый рендереры согласованы. Ссылки Rutube, порядок и остальные карточки не менялись. Кэш во всех 12 основных страницах и /test/: videos-data v8, rudik v6, test.js v4. Проверка: node test/check-sync.js, включая четыре проверки подписи. Повторно эту подпись не добавлять.\n'
          handoff.write_text(heading + note + text[len(heading):]); changed.append(str(handoff))
          for p in ['js/videos-data.js','js/rudik.js','test/test.js','test/check-sync.js']:
              subprocess.run(['node','--check',p],check=True)
          subprocess.run(['node','test/check-sync.js'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          actual = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(actual) == set(changed), actual
          subprocess.run(['git','add','--',*changed],check=True)
          print('POSTCARD_SUBTITLE_VERIFIED',len(updated_pages),'pages; exact video ID/order unchanged')
          PY
          published=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/postcard-subtitle.py
            git commit -m 'Add New Year greeting subtitle below Postcard without changing videos or order'
            if git push origin HEAD:main; then
              published=true
              break
            fi
            echo 'Main moved: re-read and apply the scoped change again, never replay a stale commit.'
          done
          test "$published" = true
          git fetch origin main
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          for name in ['js/videos-data.js','js/rudik.js','test/test.js','иишница/index.html','test/index.html','test/check-sync.js']:
              assert subprocess.check_output(['git','show','origin/main:'+name]) == Path(name).read_bytes(), name
          print('COMMITTED_READBACK_OK')
          PY
